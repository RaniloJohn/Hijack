        usercheck: (
          <React.Fragment>
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />

        ),

            <circle cx="9" cy="7" r="4" />

      const nameKey = name.toLowerCase().replace(/icon$/, '');
      const paths = iconMap[nameKey];

      if (!paths) {
        console.warn(`Icon "${name}" not found in local IconMap`);
        return null;
      }

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          {...props}
        >
          {paths}
        </svg>
      );
    };

    // --- LOGIN PORTAL VIEW ---
    function Login({ onLoginSuccess }) {
      const [isRegister, setIsRegister] = useState(false);
      const [isRedirecting, setIsRedirecting] = useState(false);
      
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('student');
      
      const [error, setError] = useState(null);
      const [success, setSuccess] = useState(null);

      useEffect(() => {
        initializeDB();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (isRedirecting) return;
        setError(null);
        setSuccess(null);

        if (!username || !password) {
          setError('Please fill in all fields.');
          return;
        }

        const res = loginUser(username, password);
        if (res.success) {
          setSuccess('Login successful!');
          setIsRedirecting(true);
          setTimeout(() => {
            onLoginSuccess();
            setIsRedirecting(false);
          }, 800);
        } else {
          setError(res.error || 'Login failed');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (isRedirecting) return;
        setError(null);
        setSuccess(null);

        if (!username || !password || !name || !email) {
          setError('Please fill in all fields.');
          return;
        }

        const res = registerUser(username, password, name, role, email);
        if (res.success) {
          setSuccess('Account created successfully! You can now log in.');
          setIsRegister(false);
          setName('');
          setEmail('');
        } else {
          setError(res.error || 'Registration failed');
        }
      };

      const quickLogin = (user) => {
        if (isRedirecting) return;
        setError(null);
        setSuccess(null);
        setIsRegister(false);
        const pass = user === 'alice' ? 'alice123' : 'bob123';
        
        setUsername(user);
        setPassword(pass);

        setTimeout(() => {
          const res = loginUser(user, pass);
          if (res.success) {
            setSuccess('Login successful!');
            setIsRedirecting(true);
            setTimeout(() => {
              onLoginSuccess();
              setIsRedirecting(false);
            }, 800);
          } else {
            setError(res.error || 'Login failed');
          }
        }, 100);
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden font-sans">
          <div className="absolute top-[-20%] left-[-20%] w-[60%] h-[60%] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>
          <div className="absolute bottom-[-20%] right-[-20%] w-[60%] h-[60%] rounded-full bg-violet-600/10 blur-[120px] pointer-events-none"></div>

          <div className="max-w-md w-full space-y-8 z-10">
            <div className="text-center">
              <div className="inline-flex items-center justify-center mb-4">
                <img src="public/logo.png" alt="RivanCyber Logo" className="h-20 w-auto object-contain" onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=150&auto=format&fit=crop&q=80"; }} />
              </div>
              <h2 className="text-3xl font-extrabold text-white tracking-tight">
                RivanCyber Training Center
              </h2>
              <p className="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold text-blue-400">
                Session Hijacking Educational Lab
              </p>
            </div>

            <div className="bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 rounded-2xl shadow-2xl p-8 space-y-6">
              <div className="flex border-b border-slate-700">
                <button
                  disabled={isRedirecting}
                  onClick={() => { setIsRegister(false); setError(null); setSuccess(null); }}
                  className={`flex-1 pb-4 text-center text-sm font-semibold transition-all border-b-2 ${
                    !isRegister 
                      ? 'border-blue-500 text-blue-400' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  } ${isRedirecting ? 'opacity-50 cursor-not-allowed' : ''}`}
                >
                  <span className="flex items-center justify-center gap-2">
                    <Icon name="login" className="w-4 h-4" />
                    Sign In
                  </span>
                </button>
                <button
                  disabled={isRedirecting}
                  onClick={() => { setIsRegister(true); setError(null); setSuccess(null); }}
                  className={`flex-1 pb-4 text-center text-sm font-semibold transition-all border-b-2 ${
                    isRegister 
                      ? 'border-blue-500 text-blue-400' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  } ${isRedirecting ? 'opacity-50 cursor-not-allowed' : ''}`}
                >
                  <span className="flex items-center justify-center gap-2">
                    <Icon name="userplus" className="w-4 h-4" />
                    Register
                  </span>
                </button>
              </div>

              {error && (
                <div className="p-4 bg-red-500/10 border border-red-500/30 text-red-300 rounded-xl text-sm flex items-start gap-2.5">
                  <Icon name="shieldalert" className="w-5 h-5 text-red-400 shrink-0" />
                  <span>{error}</span>
                </div>
              )}

              {success && (
                <div className="p-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 rounded-xl text-sm flex items-start gap-2.5">
                  <Icon name="usercheck" className="w-5 h-5 text-emerald-400 shrink-0" />
                  <span>{success}</span>
                </div>
              )}

              <form className="space-y-4" onSubmit={isRegister ? handleRegister : handleLogin}>
                {isRegister && (
                  <React.Fragment>
                    <div className="space-y-1.5">
                      <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Full Name</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                          <Icon name="user" className="h-4.5 w-4.5" />
                        </div>
                        <input
                          type="text"
                          value={name}
                          onChange={(e) => setName(e.target.value)}
                          placeholder="e.g. Bob Jenkins"
                          className="w-full bg-slate-900 border border-slate-700/60 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all text-sm"
                        />
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Email Address</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                          <Icon name="mail" className="h-4.5 w-4.5" />
                        </div>
                        <input
                          type="email"
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          placeholder="bob.jenkins@rivancyber.edu"
                          className="w-full bg-slate-900 border border-slate-700/60 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all text-sm"
                        />
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Institution Role</label>
                      <div className="grid grid-cols-2 gap-3">
                        <button
                          type="button"
                          disabled={isRedirecting}
                          onClick={() => setRole('student')}
                          className={`py-2 px-4 rounded-xl border text-sm font-semibold transition-all ${
                            role === 'student'
                              ? 'bg-blue-600/10 border-blue-500 text-blue-400'
                              : 'bg-slate-900 border-slate-700/60 text-slate-400 hover:text-slate-300'
                          } disabled:opacity-50 disabled:cursor-not-allowed`}
                        >
                          Student
                        </button>
                        <button
                          type="button"
                          disabled={isRedirecting}
                          onClick={() => setRole('teacher')}
                          className={`py-2 px-4 rounded-xl border text-sm font-semibold transition-all ${
                            role === 'teacher'
                              ? 'bg-blue-600/10 border-blue-500 text-blue-400'
                              : 'bg-slate-900 border-slate-700/60 text-slate-400 hover:text-slate-300'
                          } disabled:opacity-50 disabled:cursor-not-allowed`}
                        >
                          Teacher
                        </button>
                      </div>
                    </div>
                  </React.Fragment>
                )}

                <div className="space-y-1.5">
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Username</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                      <Icon name="user" className="h-4.5 w-4.5" />
                    </div>
                    <input
                      type="text"
                      id="username"
                      name="username"
                      autoComplete={isRegister ? "new-username" : "username"}
                      value={username}
                      onChange={(e) => setUsername(e.target.value)}
                      placeholder="Enter username"
                      className="w-full bg-slate-900 border border-slate-700/60 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all text-sm"
                    />
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                      <Icon name="lock" className="h-4.5 w-4.5" />
                    </div>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      autoComplete={isRegister ? "new-password" : "current-password"}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-slate-900 border border-slate-700/60 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all text-sm"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  className={`w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/20 hover:shadow-blue-500/30 transition-all flex items-center justify-center gap-2 mt-6 cursor-pointer ${
                    isRedirecting ? 'opacity-50 cursor-not-allowed' : ''
                  }`}
                >
                  <span>{isRedirecting ? 'Signing In...' : isRegister ? 'Register Account' : 'Sign In'}</span>
                  <Icon name="arrowright" className="w-4 h-4" />
                </button>
              </form>

              {!isRegister && (
                <div className="space-y-3.5 pt-4 border-t border-slate-700/50">
                  <span className="block text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">
                    Quick-Login Lab Accounts
                  </span>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"

    // --- MAIN PORTAL VIEW ---

      const [newCourseName, setNewCourseName] = useState('');
      const [newCourseCode, setNewCourseCode] = useState('');
      const [newCourseColor, setNewCourseColor] = useState('from-blue-600 to-indigo-700');

      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventDate, setNewEventDate] = useState('');
      
      const [fileErrorMsg, setFileErrorMsg] = useState(null);
      const [showExamAnswers, setShowExamAnswers] = useState(false);

      useEffect(() => {
        setCourses(getCourses());
        const handleDbChanged = () => {
          setCourses(getCourses());
        };
        window.addEventListener('db_changed', handleDbChanged);
        return () => {
          window.removeEventListener('db_changed', handleDbChanged);
        };
      }, []);

      useEffect(() => {
        if (currentUser) {
          setMessages(getMessages(currentUser.username));
          setCalendarEvents(getCalendarEvents(currentUser.username));
        }
      }, [currentUser]);

      const handleLogout = () => {
        if (currentSession) {
          logoutUser(currentSession.id);
        }
        onLogoutSuccess();
      };

      const handleSubmitAssignment = (e) => {
        e.preventDefault();
        if (!selectedAssignment || !currentUser || !submissionText) return;
        
        submitAssignment(selectedAssignment.id, currentUser.username, submissionText);
        setSubmissionText('');
        setSelectedAssignment(null);
        alert('Assignment submitted successfully!');
        window.location.reload();
      };

      const handleGradeSubmission = (submissionId) => {
        const data = gradingScores[submissionId];
        if (!data || data.grade === undefined) return;
        
        gradeSubmission(submissionId, data.grade, data.feedback || '');
        alert('Grade saved successfully!');
        
        if (selectedAssignment) {
          setActiveSubmissions(getSubmissions(selectedAssignment.id));
        }
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!currentUser || !msgReceiver || !msgSubject || !msgBody) return;
        
        sendMessage(currentUser.username, msgReceiver.trim().toLowerCase(), msgSubject, msgBody);
        setMsgReceiver('');
        setMsgSubject('');
        setMsgBody('');
        setIsNewMsgOpen(false);
        setMessages(getMessages(currentUser.username));
        alert('Message sent successfully!');
      };

      const handleCreateCourse = (e) => {
        e.preventDefault();
        if (!currentUser || !newCourseName || !newCourseCode) return;
        
        createCourse(newCourseCode, newCourseName, newCourseColor, currentUser.username);
        setNewCourseName('');
        setNewCourseCode('');
        setIsNewCourseOpen(false);
        setCourses(getCourses());
        alert('Course created successfully!');
      };

      const handleCreateEvent = (e) => {
        e.preventDefault();
        if (!currentUser || !newEventTitle || !newEventDate) return;
        
        addCalendarEvent(newEventTitle, newEventDate, currentUser.username);
        setNewEventTitle('');
        setNewEventDate('');
        setIsNewEventOpen(false);
        setCalendarEvents(getCalendarEvents(currentUser.username));
        alert('Event added to calendar!');
      };

      const handleFileClick = (fileName) => {
        if (fileName === 'Final_Exam_Answers.pdf') {
          if (!currentUser || currentUser.role !== 'teacher') {
            logTransaction('http', `GET /api/files/Final_Exam_Answers.pdf - 403 Forbidden - User '${currentUser?.username}' is role student`);
            setFileErrorMsg(`Access Denied! You are currently authenticated as "${currentUser?.name}" (Role: Student). The folder "/courses/SEC-202/files/restricted" requires Role: Teacher.`);
          } else {
            logTransaction('http', `GET /api/files/Final_Exam_Answers.pdf - 200 OK - Teacher '${currentUser?.username}' downloaded file`);
            setShowExamAnswers(true);
          }

                <div className="bg-slate-955 border border-slate-800/80 rounded-xl p-5 font-mono text-xs space-y-4 text-slate-300 leading-relaxed overflow-y-auto max-h-[350px] shadow-inner select-text">
                  <div className="border-b border-slate-800/50 pb-3 mb-3 text-center text-[10px] text-amber-500/80 font-bold uppercase tracking-wider">
                    *** SUCCESS! SESSION HIJACKING DEMONSTRATION COMPLETE ***
                  </div>
                  <h4 className="font-extrabold text-white text-sm text-center">SEC-202: Web Application Security - Spring 2026</h4>
                  <p className="text-center text-slate-500 text-[10px] italic">Strictly Confidential - Restricted to Course Instructors Only</p>
                  
                  <div className="space-y-4 pt-2">
                    <div>
                      <span className="text-amber-400 font-bold block mb-1">Q1: Explain the mechanics of session hijacking.</span>
                      <p className="pl-3 border-l border-slate-800">
                        Session hijacking occurs when an attacker obtains a victim's session identifier (cookie/token) and includes it in their own HTTP requests. The server recognizes the token, maps it to the victim's account, and authenticates the attacker as the victim without requiring credentials.
                      </p>
                    </div>

                    <div>
                      <span className="text-amber-400 font-bold block mb-1">Q2: How does setting the HttpOnly attribute on a cookie protect against session hijacking?</span>
                      <p className="pl-3 border-l border-slate-800">
                        The <code>HttpOnly</code> attribute instructs the browser that the cookie should not be accessible through client-side scripts (e.g., <code>document.cookie</code> in Javascript). This mitigates the risk of session hijacking via Cross-Site Scripting (XSS), as malicious scripts cannot extract the session identifier even if they run on the victim's browser.
                      </p>
                    </div>

                    <div>
                      <span className="text-amber-400 font-bold block mb-1">Q3: How does User-Agent and IP session binding protect sessions?</span>
                      <p className="pl-3 border-l border-slate-800">
                        Session binding validates that incoming requests using a session ID match the fingerprint (User-Agent, IP address) recorded when the session was initialized. If a hijacked session ID is presented from a different device, the fingerprints mismatch, and the server invalidates/blocks the request.
                      </p>
                    </div>

                    <div>
                      <span className="text-amber-400 font-bold block mb-1">Q4: Why is Session Token Rotation important?</span>
                      <p className="pl-3 border-l border-slate-800">
                        Token Rotation updates the session token on every interaction, invalidating the old one. If an attacker steals a token, it will only be valid until the next user request (which happens in milliseconds). Once the user or attacker sends a request, the old token becomes invalid, alerting the system and rendering the hijacked token useless.
                      </p>
                    </div>
                  </div>
                </div>

                  >
                    Finish Demonstration
                  </button>
                </div>
              </div>

    // --- MAIN APP WRAPPER COMPONENT ---
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [currentSession, setCurrentSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const isCheckingAuthRef = useRef(false);

      const checkAuth = () => {
        if (isCheckingAuthRef.current) return;
        isCheckingAuthRef.current = true;
        try {
          const auth = authenticateServerRequest();
          if (auth.user) {
            setCurrentUser(auth.user);
            setCurrentSession(auth.session);
          } else {
            setCurrentUser(null);
            setCurrentSession(null);
          }
          setLoading(false);
        } finally {
          isCheckingAuthRef.current = false;
        }
      };

      useEffect(() => {
        initializeDB();
        checkAuth();

        const handleDbChanged = () => {
          checkAuth();
        };
        window.addEventListener('db_changed', handleDbChanged);

        const unsubscribeCookies = subscribeToCookies(() => {
          checkAuth();
        });

        return () => {
          window.removeEventListener('db_changed', handleDbChanged);
          unsubscribeCookies();
        };
      }, []);

            if (loading) {
        return (
          <div className="min-h-screen bg-slate-955 text-slate-100 flex items-center justify-center font-sans">
            <div className="flex flex-col items-center gap-4">
              <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-slate-400 font-medium">Loading RivanCyber Training Center...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full w-full relative">
          {!currentUser ? (
            <Login onLoginSuccess={checkAuth} />
          ) : (
            <Home 
              currentUser={currentUser} 
              currentSession={currentSession} 
              onLogoutSuccess={checkAuth} 
            />
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
